name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: networkframework-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: networkframework-rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: doom-fish/apple-cf-rs
          path: apple-cf-rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: doom-fish/doom-fish-utils
          path: doom-fish-utils
          persist-credentials: false
      - run: rustc --version
      - run: swift --version && xcodebuild -version
      - run: cargo build --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features

  ios:
    name: iOS build
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    defaults:
      run:
        working-directory: networkframework-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: networkframework-rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: doom-fish/apple-cf-rs
          path: apple-cf-rs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: doom-fish/doom-fish-utils
          path: doom-fish-utils
          persist-credentials: false
      - run: rustup target add aarch64-apple-ios
      - run: cargo build --all-targets --all-features --target aarch64-apple-ios
      - run: cargo clippy --all-targets --all-features --target aarch64-apple-ios -- -D warnings
