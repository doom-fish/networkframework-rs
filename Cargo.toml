[package]
name = "networkframework"
version = "0.11.1"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/networkframework-rs"
repository = "https://github.com/doom-fish/networkframework-rs"
description = "Safe Rust bindings for Apple's Network.framework — modern, post-CFNetwork TCP / UDP / TLS / Bonjour networking on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["network", "tcp", "udp", "macos", "apple"]
categories = ["api-bindings", "os::macos-apis", "network-programming"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
    "COVERAGE.md",
]

[features]
default = []
async = []
raw-ffi = []

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "networkframework"
crate-type = ["lib"]

[build-dependencies]

[dependencies]
apple-cf = { path = "../apple-cf-rs", version = ">=0.7, <0.9" }
doom-fish-utils = { path = "../doom-fish-utils", version = ">=0.1, <0.3" }

[dev-dependencies]
pollster = "0.3"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = "full"
strip = "none"

[[example]]
name = "01_get_example"

[[example]]
name = "02_tls_get"

[[example]]
name = "03_udp_and_path"

[[example]]
name = "04_bonjour"

[[example]]
name = "05_websocket"

[[example]]
name = "06_bonjour_advertise"

[[example]]
name = "framer_length_prefix"

[[example]]
name = "interface_list"

[[example]]
name = "connection_group"

[[example]]
name = "content_context_overview"

[[example]]
name = "resolver_overview"

[[example]]
name = "privacy_context_overview"

[[example]]
name = "quic_options"

[[example]]
name = "07_async_streams"
required-features = ["async"]
